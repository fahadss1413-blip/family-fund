<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صندوق العائلة</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header><h1>صندوق العائلة</h1><button id="adminBtn">دخول المشرف</button></header>
<main>
<section class="hero"><h2>مرحبًا بكم في صندوق العائلة</h2><p>متابعة القطّة الشهرية بطريقة سهلة ومنظمة.</p></section>
<section class="card"><h3>انضمام عضو</h3><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الجوال"><button onclick="join()">انضمام</button><p id="joinMsg"></p></section>
<section id="memberArea" class="card hidden"><h3>حسابي</h3><div id="memberInfo"></div></section>
<section id="adminArea" class="hidden">
<div class="grid">
<div class="stat"><span>الرصيد</span><b id="balance">0 ر.س</b></div>
<div class="stat"><span>القطّة الشهرية</span><b id="monthly">0 ر.س</b></div>
<div class="stat"><span>الأعضاء</span><b id="membersCount">0</b></div>
</div>
<div class="card"><h3>إعدادات الصندوق</h3><input id="monthlyInput" type="number" placeholder="القطّة الشهرية"><input id="balanceInput" type="number" placeholder="الرصيد الحالي"><button onclick="saveSettings()">حفظ</button></div>
<div class="card"><h3>الأعضاء</h3><div id="members"></div></div>
<div class="card"><h3>السلف — للمشرف فقط</h3><div id="loans"></div><button onclick="addLoan()">إضافة سلفة</button></div>
</section>
</main>
</div>
<script src="app.js"></script>
</body></html>
