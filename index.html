<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق العائلة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 1.25rem; font-weight: 700; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-box { background: var(--card-bg); border: 1px solid var(--border); padding: 14px; border-radius: 12px; text-align: center; }
        .stat-box span { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 4px; }
        .stat-box strong { font-size: 1.15rem; color: var(--primary); }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); margin-top: 8px; }
        .btn-secondary:hover { background: var(--border); }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .row:last-child { border-bottom: none; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge.paid { background: rgba(16, 185, 129, 0.15); color: var(--primary); }
        .badge.unpaid { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>صندوق العائلة</h1>
        <button id="adminToggleBtn" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="toggleAdminMode()">دخول المشرف</button>
    </header>

    <!-- شاشة العضو العادي -->
    <div id="memberScreen">
        <div class="card text-center">
            <h3 style="margin-bottom: 8px;">مرحباً بك في الصندوق</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">اختر اسمك من القائمة لعرض حالتك المالية</p>
            <select id="memberSelect" onchange="loadMemberDetails()">
                <option value="">-- اختر اسمك --</option>
            </select>
        </div>

        <div id="memberDetailsCard" class="card hidden">
            <h4 id="memberNameDisplay" style="margin-bottom: 12px; color: var(--primary);"></h4>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <span style="color: var(--text-muted);">حالة القطة الشهرية:</span>
                <span id="memberStatusBadge" class="badge"></span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">رقم الجوال:</span>
                <span id="memberPhoneDisplay"></span>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم المشرف -->
    <div id="adminScreen" class="hidden">
        <div class="stats-grid">
            <div class="stat-box">
                <span>إجمالي الرصيد</span>
                <strong id="totalBalance">0 ر.س</strong>
            </div>
            <div class="stat-box">
                <span>القطة الشهرية</span>
                <strong id="monthlyFeeDisplay">0 ر.س</strong>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 1rem; margin-bottom: 12px;">إضافة عضو جديد</h3>
            <input type="text" id="newName" placeholder="اسم العضو الرباعي">
            <input type="text" id="newPhone" placeholder="رقم الجوال (اختياري)">
            <button onclick="addMember()">إضافة للقائمة</button>
        </div>

        <div class="card">
            <h3 style="font-size: 1rem; margin-bottom: 12px;">إدارة أعضاء العائلة</h3>
            <div id="adminMembersList">لا توجد بيانات</div>
        </div>

        <button class="btn-secondary" onclick="toggleAdminMode()">خروج من وضع المشرف</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "family_fund_data_v2";
    const ADMIN_PASS = "1234";

    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        monthly: 500,
        members: []
    };

    function saveDB() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        render();
    }

    function formatMoney(amount) {
        return Number(amount).toLocaleString("ar-SA") + " ر.س";
    }

    let isAdmin = false;
    function toggleAdminMode() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال رمز المشرف:");
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                document.getElementById("adminScreen").classList.remove("hidden");
                document.getElementById("memberScreen").classList.add("hidden");
                document.getElementById("adminToggleBtn").textContent = "شاشة الأعضاء";
                render();
            } else if (pass !== null) {
                alert("الرمز غير صحيح!");
            }
        } else {
            isAdmin = false;
            document.getElementById("adminScreen").classList.add("hidden");
            document.getElementById("memberScreen").classList.remove("hidden");
            document.getElementById("adminToggleBtn").textContent = "دخول المشرف";
            render();
        }
    }

    function addMember() {
        let name = document.getElementById("newName").value.trim();
        let phone = document.getElementById("newPhone").value.trim();
        if (!name) {
            alert("الرجاء كتابة اسم العضو");
            return;
        }
        db.members.push({ name, phone, paid: false });
        document.getElementById("newName").value = "";
        document.getElementById("newPhone").value = "";
        saveDB();
        alert("تمت الإضافة بنجاح");
    }

    function togglePaidStatus(index) {
        db.members[index].paid = !db.members[index].paid;
        saveDB();
    }

    function loadMemberDetails() {
        let index = document.getElementById("memberSelect").value;
        let card = document.getElementById("memberDetailsCard");
        if (index === "") {
            card.classList.add("hidden");
            return;
        }
        let m = db.members[index];
        document.getElementById("memberNameDisplay").textContent = m.name;
        document.getElementById("memberPhoneDisplay").textContent = m.phone || "غير متوفر";
        let badge = document.getElementById("memberStatusBadge");
        badge.textContent = m.paid ? "مسدد لشهر الحالي" : "غير مسدد";
        badge.className = "badge " + (m.paid ? "paid" : "unpaid");
        card.classList.remove("hidden");
    }

    function render() {
        let paidCount = db.members.filter(m => m.paid).length;
        let total = paidCount * db.monthly;
        
        document.getElementById("totalBalance").textContent = formatMoney(total);
        document.getElementById("monthlyFeeDisplay").textContent = formatMoney(db.monthly);

        let select = document.getElementById("memberSelect");
        let currentSelected = select.value;
        select.innerHTML = '<option value="">-- اختر اسمك --</option>';
        db.members.forEach((m, i) => {
            select.innerHTML += `<option value="${i}">${m.name}</option>`;
        });
        select.value = currentSelected;
        if(currentSelected !== "") loadMemberDetails();

        let adminList = document.getElementById("adminMembersList");
        if (db.members.length === 0) {
            adminList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">لا يوجد أعضاء مضافين حتى الآن</p>';
        } else {
            adminList.innerHTML = db.members.map((m, i) => `
                <div class="row">
                    <div>
                        <strong>${m.name}</strong><br>
                        <span style="color: var(--text-muted); font-size: 0.75rem;">${m.phone || "بدون جوال"}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="badge ${m.paid ? 'paid' : 'unpaid'}">${m.paid ? 'مسدد' : 'غير مسدد'}</span>
                        <button style="width: auto; padding: 6px 10px; font-size: 0.75rem;" onclick="togglePaidStatus(${i})">تغيير</button>
                    </div>
                </div>
            `).join("");
        }
    }

    render();
</script>

</body>
</html>
