<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qattah cloud - فهد</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b131f; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .nav-btns { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; }
        .btn-green { background-color: #10b981; color: white; }
        .btn-dark { background-color: #1f293d; color: white; }
        .btn-full { width: 100%; padding: 12px; margin-top: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background-color: #152238; border: 1px solid #2a3c5a; border-radius: 12px; padding: 15px; }
        .card-title { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 8px; }
        .card-value { font-size: 20px; font-weight: bold; text-align: center; }
        select, input { width: 100%; padding: 10px; background-color: #0b131f; border: 1px solid #2a3c5a; border-radius: 6px; color: white; margin-bottom: 10px; text-align: center; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        .member-item { display: flex; justify-content: space-between; padding: 10px; background-color: #0b131f; border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="nav-btns">
            <button class="btn btn-green">الرئيسية</button>
            <button class="btn btn-green">واجهة فهد</button>
        </div>
        <div>
            <span style="font-size: 12px; color: #94a3b8;">Qattah cloud</span>
            <h2 style="text-align: right;">فهد</h2>
        </div>
    </div>

    <div class="stats-grid">
        <div class="card">
            <div class="card-title">إجمالي المسادمة هذا الشهر</div>
            <select id="monthSelect">
                <option value="يناير">يناير</option>
                <option value="فبراير">فبراير</option>
                <option value="مارس">مارس</option>
            </select>
            <div class="card-value" id="monthlyTotal">0</div>
        </div>
        <div class="card">
            <div class="card-title">إجمالي رصيد الصندوق</div>
            <br>
            <div class="card-value" id="grandTotal">0</div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">إضافة عضو جديد</div>
        <input type="text" id="memberName" placeholder="الاسم كامل">
        <input type="text" id="memberPhone" placeholder="رقم الجوال (مثال: 0555555555)">
        <input type="number" id="memberAmount" placeholder="المبلغ المطلوبة">
        <input type="number" id="memberPaid" placeholder="المبلغ المدفوع">
        <button class="btn btn-green btn-full" onclick="addMember()">إضافة للقائمة</button>
    </div>

    <div class="card">
        <div class="section-title">ادارة السلف</div>
        <div id="membersList">لا توجد بيانات</div>
    </div>

    <button class="btn btn-dark btn-full">العودة لواجهة فهد</button>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "...",
        databaseURL: "https://xxxx-default-rtdb.firebaseio.com",
        projectId: "...",
        storageBucket: "...",
        messagingSenderId: "...",
        appId: "..."
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // دالة إضافة عضو مباشر بدون كلمة سر
    function addMember() {
        const name = document.getElementById('memberName').value;
        const phone = document.getElementById('memberPhone').value;
        const amount = document.getElementById('memberAmount').value;
        const paid = document.getElementById('memberPaid').value;

        if (!name || !amount) {
            alert('يرجى تعبئة الاسم والمبلغ على الأقل');
            return;
        }

        const newMemberRef = db.ref('members').push();
        newMemberRef.set({
            name: name,
            phone: phone,
            amount: Number(amount),
            paid: Number(paid || 0)
        }).then(() => {
            document.getElementById('memberName').value = '';
            document.getElementById('memberPhone').value = '';
            document.getElementById('memberAmount').value = '';
            document.getElementById('memberPaid').value = '';
        });
    }

    // قراءة البيانات وتحديث الشاشة فورياً
    db.ref('members').on('value', (snapshot) => {
        const data = snapshot.val();
        const listDiv = document.getElementById('membersList');
        let total = 0;
        
        if (data) {
            listDiv.innerHTML = '';
            Object.keys(data).forEach(key => {
                const item = data[key];
                total += Number(item.paid || 0);
                listDiv.innerHTML += `
                    <div class="member-item">
                        <span>${item.name}</span>
                        <span>المدفوع: ${item.paid}</span>
                    </div>
                `;
            });
        } else {
            listDiv.innerHTML = 'لا توجد بيانات';
        }
        document.getElementById('grandTotal').innerText = total;
        document.getElementById('monthlyTotal').innerText = total;
    });
</script>

</body>
</html>
